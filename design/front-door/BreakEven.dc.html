<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Instrument Sans", system-ui, -apple-system, sans-serif; }
    a { color: #15803D; } a:hover { color: #14532D; }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
</helmet>
<div style="width: 1280px; height: 800px; background: #FFFFFF; display: flex; flex-direction: column; position: relative;">

  <div style="display: flex; justify-content: center; padding: 30px 0 0 0;">
    <button onClick="{{ tapMark }}" style="border: none; background: none; cursor: pointer; padding: 4px; display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="16" height="16" rx="2" stroke="#111827" stroke-width="1.6"></rect><path d="M6 13.5 L10 8 L12.5 11 L14.5 6.5" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: #111827; font-family: inherit;">CSP BREAK-EVEN</span>
    </button>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">

    <sc-if value="{{ locked }}" hint-placeholder-val="{{ true }}">
      <div style="width: 380px; display: flex; flex-direction: column; gap: 18px;">
        <div style="font-size: 14px; color: #6B7280; text-align: center;">Where does a cash-secured put actually break even?</div>
        <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(17,24,39,0.06); display: flex; flex-direction: column; gap: 16px;">
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: #6B7280;">STRIKE $</label>
              <input value="{{ strike }}" onInput="{{ setStrike }}" style="height: 46px; border: 1px solid #E5E7EB; border-radius: 8px; padding: 0 10px; font-size: 16px; font-weight: 500; font-family: inherit; color: #111827; outline: none; width: 100%; box-sizing: border-box;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: #6B7280;">PREMIUM $</label>
              <input value="{{ premium }}" onInput="{{ setPremium }}" style="height: 46px; border: 1px solid #E5E7EB; border-radius: 8px; padding: 0 10px; font-size: 16px; font-weight: 500; font-family: inherit; color: #111827; outline: none; width: 100%; box-sizing: border-box;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: #6B7280;">DAYS</label>
              <input value="{{ dte }}" onInput="{{ setDte }}" style="height: 46px; border: 1px solid #E5E7EB; border-radius: 8px; padding: 0 10px; font-size: 16px; font-weight: 500; font-family: inherit; color: #111827; outline: none; width: 100%; box-sizing: border-box;">
            </div>
          </div>
          <div style="border-top: 1px solid #F3F4F6; display: flex; flex-direction: column; gap: 10px; padding-top: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <span style="font-size: 13px; color: #6B7280;">Break-even</span>
              <span style="font-size: 26px; font-weight: 700; color: #111827; font-variant-numeric: tabular-nums;">{{ breakeven }}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <span style="font-size: 13px; color: #6B7280;">Return on collateral</span>
              <span style="font-size: 17px; font-weight: 600; color: #15803D; font-variant-numeric: tabular-nums;">{{ roc }}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <span style="font-size: 13px; color: #6B7280;">Annualized</span>
              <span style="font-size: 17px; font-weight: 600; color: #15803D; font-variant-numeric: tabular-nums;">{{ annual }}</span>
            </div>
          </div>
        </div>
        <div style="font-size: 12px; color: #9CA3AF; text-align: center;">Prices are yours to bring — this page calls no market data.</div>
      </div>
    </sc-if>

    <sc-if value="{{ unlocked }}" hint-placeholder-val="{{ false }}">
      <div style="width: 380px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 28px; box-shadow: 0 1px 3px rgba(17,24,39,0.06); display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 15px; font-weight: 600; color: #111827;">Member sign-in</div>
        <input placeholder="Email" style="height: 46px; border: 1px solid #E5E7EB; border-radius: 8px; padding: 0 12px; font-size: 14px; font-family: inherit; color: #111827; background: #F9FAFB; outline: none;">
        <input placeholder="Password" type="password" style="height: 46px; border: 1px solid #E5E7EB; border-radius: 8px; padding: 0 12px; font-size: 14px; font-family: inherit; color: #111827; background: #F9FAFB; outline: none;">
        <button style="height: 46px; border: none; border-radius: 8px; background: #16A34A; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;">Sign in</button>
        <button onClick="{{ relock }}" style="border: none; background: none; font-size: 12px; color: #6B7280; cursor: pointer; font-family: inherit; padding: 0; text-align: left;">Back</button>
      </div>
    </sc-if>

  </div>

  <div style="display: flex; justify-content: center; padding: 0 0 26px 0; font-size: 12px; color: #D1D5DB;">© 2026 · educational, not advice</div>
  <div style="position: absolute; top: 24px; left: 24px; font-size: 12px; color: #6B7280; background: #F3F4F6; border-radius: 999px; padding: 6px 12px;">Sample unlock: tap the logo 5×. Inputs are sample values.</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  state = { strike: '100', premium: '1.85', dte: '30', taps: 0, unlocked: false }

  num(v) { const n = parseFloat(v); return isFinite(n) ? n : null }

  renderVals() {
    const s = this.state
    const K = this.num(s.strike), P = this.num(s.premium), D = this.num(s.dte)
    const ok = K !== null && P !== null && K > 0 && P >= 0 && P < K
    const be = ok ? K - P : null
    const roc = ok ? (P / K) * 100 : null
    const annual = ok && D !== null && D > 0 ? roc * (365 / D) : null
    const f2 = (n) => n === null ? '—' : '$' + (Math.round(n * 100) / 100).toFixed(2)
    const pct = (n) => n === null ? '—' : (Math.round(n * 100) / 100).toFixed(2) + '%'
    return {
      strike: s.strike, premium: s.premium, dte: s.dte,
      setStrike: (e) => this.setState({ strike: e.target.value }),
      setPremium: (e) => this.setState({ premium: e.target.value }),
      setDte: (e) => this.setState({ dte: e.target.value }),
      breakeven: f2(be),
      roc: pct(roc),
      annual: pct(annual),
      tapMark: () => {
        const taps = s.taps + 1
        if (taps >= 5) this.setState({ unlocked: true, taps: 0 })
        else this.setState({ taps: taps })
      },
      locked: !s.unlocked,
      unlocked: s.unlocked,
      relock: () => this.setState({ unlocked: false, taps: 0 }),
    }
  }
}
</script>
</body>
</html>
