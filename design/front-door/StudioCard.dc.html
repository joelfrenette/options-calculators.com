<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Newsreader", Georgia, serif; }
    a { color: #8A5A2B; } a:hover { color: #5C3A18; }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
</helmet>
<div style="width: 1280px; height: 800px; background: #F6F1E7; display: flex; flex-direction: column; position: relative;">

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 28px 36px 0 36px;">
    <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.08em; color: #26221B;">OPTIONS-CALCULATORS.COM</span>
    <button onClick="{{ open }}" style="border: none; background: none; font-size: 13px; font-style: italic; color: #A08C6C; cursor: pointer; font-family: inherit; padding: 0;">Members — sign in</button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">

    <sc-if value="{{ locked }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
        <div style="font-size: 21px; font-style: italic; color: #6B5B41;">A simple calculator.</div>
        <div style="width: 330px; background: #FDFBF6; border: 1px solid #E5DCC9; border-radius: 4px; padding: 22px; box-shadow: 0 18px 40px rgba(60,45,20,0.10);">
          <div style="height: 76px; border-bottom: 1px solid #EFE8D8; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; font-size: 46px; font-weight: 500; color: #26221B; overflow: hidden; white-space: nowrap;">{{ disp }}</div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin-top: 16px;">
            <sc-for list="{{ keys }}" as="k" hint-placeholder-count="20">
              <button onClick="{{ k.press }}" style="height: 54px; border: 1px solid {{ k.bd }}; border-radius: 4px; background: {{ k.bg }}; color: {{ k.fg }}; font-size: 19px; font-weight: 500; font-family: inherit; cursor: pointer;">{{ k.label }}</button>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ unlocked }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
        <div style="font-size: 21px; font-style: italic; color: #6B5B41;">Welcome back.</div>
        <div style="width: 330px; background: #FDFBF6; border: 1px solid #E5DCC9; border-radius: 4px; padding: 28px; box-shadow: 0 18px 40px rgba(60,45,20,0.10); display: flex; flex-direction: column; gap: 13px;">
          <input placeholder="Email" style="height: 46px; border: 1px solid #E5DCC9; border-radius: 4px; padding: 0 13px; font-size: 15px; font-family: inherit; color: #26221B; background: #F6F1E7; outline: none;">
          <input placeholder="Password" type="password" style="height: 46px; border: 1px solid #E5DCC9; border-radius: 4px; padding: 0 13px; font-size: 15px; font-family: inherit; color: #26221B; background: #F6F1E7; outline: none;">
          <button style="height: 46px; border: none; border-radius: 4px; background: #26221B; color: #F6F1E7; font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer;">Sign in</button>
          <button onClick="{{ relock }}" style="border: none; background: none; font-size: 13px; font-style: italic; color: #A08C6C; cursor: pointer; font-family: inherit; padding: 2px 0 0 0;">Back to the calculator</button>
        </div>
      </div>
    </sc-if>

  </div>

  <div style="display: flex; justify-content: center; padding: 0 0 26px 0; font-size: 12px; color: #C9BCA2;">Private tools for a small circle of options sellers.</div>

  <div style="position: absolute; top: 76px; left: 36px; font-size: 12px; color: #A08C6C; background: #EFE8D8; border-radius: 999px; padding: 6px 12px; font-family: system-ui, sans-serif;">Sample unlock: type 2468 then = — or the sign-in link</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  state = { disp: '0', acc: null, op: null, fresh: true, typed: '', unlocked: false }

  digit(d) {
    const s = this.state
    const disp = s.fresh ? String(d) : (s.disp.length < 11 ? s.disp + d : s.disp)
    this.setState({ disp: disp.replace(/^0(?=\d)/, ''), fresh: false, typed: s.typed + d })
  }
  dot() {
    const s = this.state
    if (s.fresh) { this.setState({ disp: '0.', fresh: false, typed: '' }); return }
    if (!s.disp.includes('.')) this.setState({ disp: s.disp + '.', typed: '' })
  }
  setOp(op) {
    const s = this.state
    const cur = parseFloat(s.disp)
    const acc = s.op && !s.fresh ? this.apply(s.acc, cur, s.op) : (s.acc === null || !s.fresh ? cur : s.acc)
    this.setState({ acc: acc, op: op, fresh: true, disp: this.fmt(acc), typed: '' })
  }
  apply(a, b, op) {
    if (op === '+') return a + b
    if (op === '−') return a - b
    if (op === '×') return a * b
    if (op === '÷') return b === 0 ? NaN : a / b
    return b
  }
  fmt(n) {
    if (!isFinite(n)) return 'Error'
    const r = Math.round(n * 1e9) / 1e9
    let out = String(r)
    if (out.length > 11) { const p = r.toPrecision(8); out = p.includes('e') ? p : p.replace(/\.?0+$/, '') }
    return out
  }
  eq() {
    const s = this.state
    if (s.typed === '2468' && s.op === null) { this.setState({ unlocked: true }); return }
    if (s.op === null) { this.setState({ fresh: true, typed: '' }); return }
    const res = this.apply(s.acc, parseFloat(s.disp), s.op)
    this.setState({ disp: this.fmt(res), acc: null, op: null, fresh: true, typed: '' })
  }
  clr() { this.setState({ disp: '0', acc: null, op: null, fresh: true, typed: '' }) }
  back() {
    const s = this.state
    if (s.fresh) return
    const d = s.disp.length > 1 ? s.disp.slice(0, -1) : '0'
    this.setState({ disp: d, fresh: d === '0', typed: s.typed.slice(0, -1) })
  }
  neg() { const s = this.state; this.setState({ disp: this.fmt(-parseFloat(s.disp)), typed: '' }) }

  renderVals() {
    const ink = '#26221B', numBg = '#FDFBF6', numBd = '#E5DCC9', opBg = '#F3EDDF'
    const mk = (label, press, bg, fg, bd) => ({ label: label, press: press, bg: bg || numBg, fg: fg || ink, bd: bd || numBd })
    const keys = [
      mk('C', () => this.clr(), opBg), mk('⌫', () => this.back(), opBg), mk('±', () => this.neg(), opBg), mk('÷', () => this.setOp('÷'), opBg),
      mk('7', () => this.digit('7')), mk('8', () => this.digit('8')), mk('9', () => this.digit('9')), mk('×', () => this.setOp('×'), opBg),
      mk('4', () => this.digit('4')), mk('5', () => this.digit('5')), mk('6', () => this.digit('6')), mk('−', () => this.setOp('−'), opBg),
      mk('1', () => this.digit('1')), mk('2', () => this.digit('2')), mk('3', () => this.digit('3')), mk('+', () => this.setOp('+'), opBg),
      mk('%', () => this.setState({ disp: this.fmt(parseFloat(this.state.disp) / 100), typed: '' }), opBg), mk('0', () => this.digit('0')), mk('.', () => this.dot()), mk('=', () => this.eq(), ink, '#F6F1E7', ink),
    ]
    return {
      disp: this.state.disp,
      keys: keys,
      locked: !this.state.unlocked,
      unlocked: this.state.unlocked,
      open: () => this.setState({ unlocked: true }),
      relock: () => this.setState({ unlocked: false, disp: '0', acc: null, op: null, fresh: true, typed: '' }),
    }
  }
}
</script>
</body>
</html>
